[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=42"]

[project]
name = "gatiab"
version = "1.1.2"
license = {file = "LICENSE.txt"}
description = "Gaseous Absorption Transmissions at Instrument Averaged Bands"
authors = [
    {name = "Mustapha Moulana", email="mm@hygeos.com"}
]
readme = "README.md"
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'License :: Free for non-commercial use',
    'Intended Audience :: Science/Research',
    'Intended Audience :: Developers',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Scientific/Engineering',
    'Operating System :: POSIX :: Linux',
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.4",
    "xarray>=2024.7.0",
    "netcdf4>=1.7.1",
    "scipy>=1.13.1",
    "tqdm>=4.66.5"
]

[tool.setuptools]
packages = ["gatiab"]

[tool.setuptools.package-data]
mypkg = ["*.nc"]
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
gatiab = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest"
typecheck = "pyright"

[tool.pixi.dependencies]
notebook = ">=7.5.5,<8"
ipywidgets = ">=8.1.8,<9"
pytest = ">=8.3.2"
pyright = ">=1.1"

[tool.pyright]
# Only check the maintained modules
include = [
    "gatiab/gatiab.py",
    "gatiab/constants.py",
    "gatiab/__init__.py",
    "tests",
]
# Suppress "partially unknown" noise from third-party libraries with
# incomplete stubs (e.g. xarray)
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
# Suppress call-issue and argument-type errors caused by incomplete
# stubs (e.g. missing parameters in xarray stubs, scipy interp1d
# rejecting fill_value='extrapolate')
reportCallIssue = "none"
reportArgumentType = "none"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]
# N803/N806: scientific notation (P_hl, T_fl, U, M, ...) is
# intentional
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# E402: sys.path must be set before importing gatiab
"tests/test_gatiab.py" = ["E402"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72
